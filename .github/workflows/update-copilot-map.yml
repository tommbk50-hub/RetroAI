name: Update Copilot Repo Map

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.ipynb"

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate repo map
        run: python .github/scripts/update_repo_map.py

      - name: Commit updated instructions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet .github/copilot-instructions.md; then
            git add .github/copilot-instructions.md
            git commit -m "chore: auto-update repo map in copilot-instructions.md [skip ci]"
            git push
          fi
